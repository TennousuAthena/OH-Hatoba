[package]
name = "hatoba-runtime"
description = "Shared Hatoba application services with an injected native host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Shared source files also compile in the desktop shell, which enables this feature there.
desktop-host = []

[dependencies]
hatoba-core.workspace = true
hatoba-ssh.workspace = true
hatoba-ai.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
uuid.workspace = true
base64.workspace = true
bytes.workspace = true
async-trait.workspace = true
futures.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
serde_yaml_ng = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
serde_json.workspace = true

[dev-dependencies]
hatoba-core = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

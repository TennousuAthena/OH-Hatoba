[package]
name = "hatoba-ohos"
description = "HarmonyOS native host for Hatoba's shared Rust libraries"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
test-tools = ["dep:russh", "dep:russh-sftp"]

[[bin]]
name = "fixture-server"
path = "src/bin/fixture_server.rs"
required-features = ["test-tools"]

[[bin]]
name = "network-probe"
path = "src/bin/network_probe.rs"
required-features = ["test-tools"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hatoba-core.workspace = true
hatoba-ssh.workspace = true
hatoba-ai.workspace = true
hatoba-net.workspace = true
hatoba-runtime = { path = "../../../crates/hatoba-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
zeroize.workspace = true
uuid.workspace = true
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
russh-sftp = { version = "3", optional = true }
